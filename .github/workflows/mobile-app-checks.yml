name: Mobile app checks
on:
  pull_request:
    paths:
      - 'mobile/klever-driver/**'
      - '.github/workflows/mobile-app-checks.yml'
  push:
    branches:
      - feature/klever-driver-mobile
    paths:
      - 'mobile/klever-driver/**'
      - '.github/workflows/mobile-app-checks.yml'
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/klever-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate Expo configuration
        run: npx expo config --type public --json > /dev/null
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform all --output-dir dist
