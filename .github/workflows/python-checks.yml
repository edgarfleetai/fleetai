name: Python checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/telegram-contract-delivery-feedback]
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m compileall -q fleetai app.py
