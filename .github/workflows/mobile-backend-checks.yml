name: Mobile backend checks
on:
  pull_request:
    paths:
      - 'mobile/backend/**'
      - '.github/workflows/mobile-backend-checks.yml'
  push:
    branches:
      - feature/klever-driver-mobile
    paths:
      - 'mobile/backend/**'
      - '.github/workflows/mobile-backend-checks.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -v -p 'test_*.py'
